name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'energy-reactor---block-puzzle (1).zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract game ZIP
        run: |
          unzip -q "energy-reactor---block-puzzle (1).zip" -d game-source
          cd game-source

      - name: Install dependencies and build
        run: |
          cd game-source
          npm install
          npm install @capacitor/cli@8.6.0 @capacitor/android@8.6.0
          npm run build

      - name: Create Android project
        run: |
          cd game-source
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd game-source/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fruit-Bubble-APK
          path: game-source/android/app/build/outputs/apk/debug/app-debug.apk
